[supervisord]
nodaemon=false
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:go-server]
command=/app/server/sqlite-hub-server
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
environment=PORT="3000"

[program:nextjs]
command=node /app/nextjs/server.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=PORT="3001",HOSTNAME="0.0.0.0",NEXT_PUBLIC_GO_API_URL="http://localhost:3000"
