[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:go-server]
command=/app/server/sqlite-hub-server
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
environment=PORT="3000",DATA_PATH="%(ENV_DATA_PATH)s",ADMIN_TOKEN="%(ENV_ADMIN_TOKEN)s",SESSION_SECRET="%(ENV_SESSION_SECRET)s",FILE_TOKEN_SIGNING_SECRET="%(ENV_FILE_TOKEN_SIGNING_SECRET)s",SQLITE_HUB_MODE="%(ENV_SQLITE_HUB_MODE)s",ENABLE_CONTROL_DB="%(ENV_ENABLE_CONTROL_DB)s",CONTROL_PLANE_SECRET="%(ENV_CONTROL_PLANE_SECRET)s",REDIS_URL="%(ENV_REDIS_URL)s",CACHE_MODE="%(ENV_CACHE_MODE)s",CORS_ALLOWED_ORIGINS="%(ENV_CORS_ALLOWED_ORIGINS)s",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

[program:nextjs]
command=node /app/dashboard/.next/standalone/server.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=PORT="3001",NODE_ENV="production",HOSTNAME="0.0.0.0"
