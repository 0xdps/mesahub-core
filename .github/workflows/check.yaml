name: Check

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Install dependencies
        run: npm install

      - name: Prepare env for compose validation
        run: cp .env.example .env

      - name: Validate runtime contract
        run: just contract

      - name: Check
        run: just check

      - name: Log success
        run: echo "✅ Success!"
